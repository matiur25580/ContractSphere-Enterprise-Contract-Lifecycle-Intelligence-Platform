name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/contractsphere_ci?replicaSet=rs0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Start MongoDB replica set
        run: |
          docker run --detach --name contractsphere-mongodb --publish 27017:27017 mongo:7.0@sha256:41e8195b2791692695e1dc9bd21cd51d0a3af05fff8ace9304a5c1acf94f1ae1 mongod --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec contractsphere-mongodb mongosh --quiet --eval 'db.adminCommand("ping").ok' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec contractsphere-mongodb mongosh --quiet --eval 'try { rs.status() } catch (error) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]}) }'
          for attempt in $(seq 1 30); do
            if docker exec contractsphere-mongodb mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then exit 0; fi
            sleep 2
          done
          echo "MongoDB replica set did not become primary"
          exit 1
      - name: Install dependencies
        run: npm ci
      - name: Full dependency security audit
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: API validation and database integration tests
        run: npm run test --workspace @contractsphere/api

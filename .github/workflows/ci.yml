name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/contractsphere_ci?replicaSet=rs0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Initialize MongoDB replica set
        run: |
          mongosh "mongodb://127.0.0.1:27017/admin" --quiet --eval 'try { rs.status() } catch (error) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]}) }'
          for attempt in $(seq 1 30); do
            if mongosh "mongodb://127.0.0.1:27017/admin" --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then exit 0; fi
            sleep 2
          done
          echo "MongoDB replica set did not become primary"
          exit 1
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: API validation and database integration tests
        run: npm run test --workspace @contractsphere/api

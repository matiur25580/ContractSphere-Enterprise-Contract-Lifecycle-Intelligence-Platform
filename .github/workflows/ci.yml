name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/contractsphere_ci?replicaSet=rs0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start MongoDB replica set
        run: |
          docker run --detach --name contractsphere-mongodb --publish 27017:27017 mongo:7.0 mongod --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec contractsphere-mongodb mongosh --quiet --eval 'db.adminCommand("ping").ok' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec contractsphere-mongodb mongosh --quiet --eval 'try { rs.status() } catch (error) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]}) }'
          for attempt in $(seq 1 30); do
            if docker exec contractsphere-mongodb mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then exit 0; fi
            sleep 2
          done
          echo "MongoDB replica set did not become primary"
          exit 1
      - name: Install dependencies
        run: npm install
      - name: Commit refreshed npm workspace lockfile
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_HEAD_REF"
          git switch -C "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh npm workspace lockfile"
          git push origin "HEAD:$GITHUB_HEAD_REF"
      - name: Full dependency security audit
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: API validation and database integration tests
        run: npm run test --workspace @contractsphere/api

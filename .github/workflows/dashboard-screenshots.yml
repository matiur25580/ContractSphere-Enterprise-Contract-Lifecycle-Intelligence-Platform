name: Dashboard screenshots
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/screenshots/**"
      - "README.md"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dashboard-screenshots-main
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture dashboard screens
        run: npm run screenshots
      - name: Commit refreshed screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo "Screenshots are already current."
            exit 0
          fi
          git commit -m "docs: refresh dashboard showcase screenshots"
          git push
